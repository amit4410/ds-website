<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Science Website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Data Science Website</h1>
    <span id="status">Checking backend...</span>
  </header>

  <main>
    <section class="card">
      <h2>Predict (Iris Dataset)</h2>
      <p>Enter 4 feature values separated by commas:</p>
      <input id="features" value="5.1, 3.5, 1.4, 0.2" />
      <button onclick="predict()">Predict</button>
      <div id="result" class="result"></div>
    </section>

    <section class="card">
      <h2>History</h2>
      <table>
        <thead>
          <tr><th>Features</th><th>Label</th><th>Confidence</th></tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
